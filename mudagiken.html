function spec(i){stage.innerHTML=`<div class="status" id="specHud">回避 0 / 20　HP ❤❤❤</div><div class="status right">RELEASE GATE</div><div class="runner" id="specRunner" style="bottom:60px;top:auto;left:46%;transition:left .08s">👨‍💻</div><div style="position:absolute;left:0;right:0;bottom:48px;height:5px;background:#3c5369"></div><div class="muted" style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%)">← → または 画面左右タップ</div>`;const r=document.getElementById('specRunner'),hud=document.getElementById('specHud');let x=.46,hp=3,dodges=0,active=true,items=[],last=0,lastSpawn=0;function move(d){x=Math.max(.03,Math.min(.92,x+d));r.style.left=(x*100)+'%';tone(260+Math.round(x*300),.035,'square',.55)}const key=e=>{if(e.key==='ArrowLeft'){e.preventDefault();move(-.09)}if(e.key==='ArrowRight'){e.preventDefault();move(.09)}};addEventListener('keydown',key);const tap=e=>{const q=stage.getBoundingClientRect();move(e.clientX<q.left+q.width/2?-.09:.09)};stage.addEventListener('pointerdown',tap);cleanups.push(()=>{active=false;removeEventListener('keydown',key);stage.removeEventListener('pointerdown',tap)});function drop(){const b=document.createElement('div');b.className='obstacle';b.textContent=['文言修正','ボタン位置変更','スマホ対応も','海外展開を考慮','AIも入れられない？','DBも変えたい','一旦全部見直し'][Math.floor(Math.random()*7)];const px=10+Math.random()*Math.max(30,stage.clientWidth-180);b.style.left=px+'px';b.style.top='-55px';stage.appendChild(b);items.push({b,x:px,y:-55,hit:false,passed:false})}function hit(a,b){const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return A.left+8<B.right&&A.right-8>B.left&&A.top+8<B.bottom&&A.bottom-8>B.top}function loop(ts){if(!active)return;if(mobileGameLite&&last&&ts-last<32){requestAnimationFrame(loop);return}const dt=Math.min(35,last?ts-last:16);last=ts;if(ts-lastSpawn>Math.max(420,820-dodges*10)){drop();lastSpawn=ts}for(const o of items){o.y+=.29*dt+(dodges*.004*dt);o.b.style.top=o.y+'px';if(!o.hit&&hit(r,o.b)){o.hit=true;hp--;boom();o.b.style.opacity=.2;hud.textContent=`回避 ${dodges} / 20　HP ${'❤'.repeat(hp)}${'♡'.repeat(3-hp)}`;if(hp<=0){active=false;fail(i,'仕様変更に埋まりました。SPRINT 2 が開始されます。');return}}if(!o.passed&&!o.hit&&o.y>stage.clientHeight-20){o.passed=true;dodges++;chord([420,630],.05,'square',.8);toast(`AVOID ${dodges}/20`,'var(--green)');hud.textContent=`回避 ${dodges} / 20　HP ${'❤'.repeat(hp)}${'♡'.repeat(3-hp)}`;if(dodges>=20){active=false;finish(i,'リリース成功！……次の仕様変更が届きました。');return}}}items=items.filter(o=>{if(o.y>stage.clientHeight+80){o.b.remove();return false}return true});requestAnimationFrame(loop)}requestAnimationFrame(loop)}

function excel(i){const W=12,H=8,pattern=new Set(['2,1','3,1','8,1','9,1','1,2','2,2','3,2','4,2','7,2','8,2','9,2','10,2','1,3','4,3','7,3','10,3','1,4','2,4','3,4','4,4','5,4','6,4','7,4','8,4','9,4','10,4','2,5','3,5','4,5','7,5','8,5','9,5','3,6','4,6','7,6','8,6']);stage.innerHTML=`<div class="stackCenter center"><div class="status" id="exHud">正解 0 / ${pattern.size}　誤塗り 0 / 5</div><h3>Excel方眼紙クラフト：設計図</h3><div class="excel" id="ex"></div><p class="muted">枠付きセルだけを緑にしてください。誤塗り5個で差し戻し。</p></div>`;const ex=document.getElementById('ex');let ok=0,wrong=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const b=document.createElement('button'),key=`${x},${y}`,req=pattern.has(key);if(req)b.classList.add('req');b.setAttribute('aria-label',`セル ${x+1},${y+1}`);b.onclick=e=>{if(b.classList.contains('on')||b.classList.contains('wrong'))return;if(req){b.classList.add('on');ok++;burst(e.clientX,e.clientY,8);tone(380+ok*8,.04,'square',.8);toast(`CELL ${ok}/${pattern.size}`,'var(--green)')}else{b.classList.add('wrong');wrong++;boom()}document.getElementById('exHud').textContent=`正解 ${ok} / ${pattern.size}　誤塗り ${wrong} / 5`;if(wrong>=5)fail(i,'設計図逸脱。Excel有識者レビューへ差し戻し。');else if(ok>=pattern.size)finish(i,'Excel城、竣工。なおセル結合は禁止されました。')};ex.appendChild(b)}}

function progress(i){stage.innerHTML=`<div class="stackCenter center" style="width:min(760px,94%);margin:auto"><div class="status" id="progHud">レビュー戻しまで 4.0秒</div><div class="big" id="pv" style="color:var(--cyan)">0%</div><div class="meter" style="width:min(680px,94%)"><i id="bar"></i></div><button class="hugeBtn gold pulse" id="pb" style="margin-top:24px">進捗を出す</button><div class="combo" id="pc">COMBO ×0</div><p class="muted">連打で進める。4秒ごとにレビュー戻しが来ます。</p></div>`;let p=0,combo=0,active=true,lastReview=performance.now();const pv=document.getElementById('pv'),bar=document.getElementById('bar'),hud=document.getElementById('progHud'),pc=document.getElementById('pc'),pb=document.getElementById('pb');pb.onclick=e=>{if(!active)return;combo++;p=Math.min(100,p+2+Math.min(4,Math.floor(combo/8)));pv.textContent=p+'%';bar.style.width=p+'%';pc.textContent='COMBO ×'+combo;burst(e.clientX,e.clientY,8);tone(260+p*5,.04,'square',.8);if(p>=100){active=false;finish(i,'進捗100%。仕事の実体は確認できませんでした。')}};let timer=setInterval(()=>{if(!active)return;const now=performance.now(),remain=Math.max(0,4-(now-lastReview)/1000);hud.textContent=`レビュー戻しまで ${remain.toFixed(1)}秒`;if(remain<=0){lastReview=now;const loss=12+Math.floor(Math.random()*9);p=Math.max(0,p-loss);combo=0;pv.textContent=p+'%';bar.style.width=p+'%';pc.textContent='COMBO ×0';boom();toast(`レビュー戻し -${loss}%`,'var(--red)')}},mobileGameLite?200:100);cleanups.push(()=>{active=false;clearInterval(timer)})}

function bugTemple(i){stage.innerHTML=`<div class="status" id="bugHud">供養 0 / 15　逃亡 0 / 5</div><div class="status right">木魚出力 300%</div><div id="bugExit" style="position:absolute;right:8px;top:68px;bottom:22px;width:82px;z-index:4;border:2px solid #ff3659;border-radius:16px;background:linear-gradient(180deg,#4e0c18dd,#19050bdd);box-shadow:0 0 28px #ff365966,inset 0 0 22px #ff365933;display:grid;place-items:center;text-align:center;font-weight:1000;color:#fff;writing-mode:vertical-rl;letter-spacing:.12em;pointer-events:none">🚨 本番環境</div><div class="stackCenter center"><div style="font-size:104px;filter:drop-shadow(0 0 24px #ffe45e88)">🙏</div><div class="big" style="font-size:clamp(28px,5vw,54px)">バグ供養寺</div><div class="muted">逃げ回る 🐛 をクリックして成仏</div><div class="muted" style="margin-top:8px;color:#ff9cab">赤くなった虫は「本番環境」へ逃亡中！</div><div id="incense" style="position:absolute;inset:0;pointer-events:none"></div></div>`;let done=0,escaped=0,active=true,bugs=[],lastSpawn=0,lastLoop=0;function incensePuff(x,y){for(let k=0;k<(mobileGameLite?2:6);k++){const q=document.createElement('i');q.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${10+Math.random()*18}px;height:${10+Math.random()*18}px;border-radius:50%;background:#d9f4ff22;filter:blur(${4+Math.random()*5}px);pointer-events:none;z-index:2;transition:transform 2.4s ease-out,opacity 2.4s`;stage.appendChild(q);requestAnimationFrame(()=>{q.style.transform=`translate(${(Math.random()-.5)*70}px,${-90-Math.random()*100}px) scale(${1.8+Math.random()*2})`;q.style.opacity='0'});setTimeout(()=>q.remove(),2500)}}function spawn(){const b=document.createElement('div');b.className='bug';b.style.transition='left 2.8s cubic-bezier(.18,.62,.25,1),top 2.8s cubic-bezier(.18,.62,.25,1),filter .25s,transform .25s';b.style.left=(20+Math.random()*Math.max(70,stage.clientWidth-230))+'px';b.style.top=(90+Math.random()*Math.max(100,stage.clientHeight-220))+'px';const icon=document.createElement('span');icon.textContent='🐛';const warn=document.createElement('span');warn.textContent='🚨 本番逃亡中';warn.style.cssText='display:none;position:absolute;left:50%;top:-27px;transform:translateX(-50%);font:1000 11px Consolas,monospace;white-space:nowrap;color:#fff;background:#b30f20;border:1px solid #ff8192;border-radius:999px;padding:4px 7px;box-shadow:0 0 16px #ff3659';b.append(icon,warn);const now=performance.now();const o={b,birth:now,hit:false,escaping:false,nextMove:now+2600+Math.random()*1600,escapeAt:now+12000+Math.random()*4000};b.addEventListener('pointerdown',e=>{if(o.hit||!active)return;o.hit=true;done++;burst(e.clientX,e.clientY,36);incensePuff(e.clientX-stage.getBoundingClientRect().left,e.clientY-stage.getBoundingClientRect().top);chord([110,165,220],.18,'sine',1);warn.style.display='none';icon.textContent='✨';b.style.animation='none';b.style.filter=mobileGameLite?'none':'drop-shadow(0 0 28px #ffe45e)';b.style.transform='scale(1.9) rotate(180deg)';toast(o.escaping?`逃亡阻止！ 成仏 ${done}/15`:`成仏 ${done}/15`,'var(--yellow)');setTimeout(()=>b.remove(),300);if(done>=15){active=false;finish(i,'全バグ成仏。なお新規バグを1件検知。')}update()});stage.appendChild(b);bugs.push(o)}function update(){const hud=document.getElementById('bugHud');if(hud)hud.textContent=`供養 ${done} / 15　逃亡 ${escaped} / 5`}function startEscape(o){if(o.escaping||o.hit)return;o.escaping=true;const warn=o.b.children[1];warn.style.display='block';o.b.style.animation='none';o.b.style.filter=mobileGameLite?'none':'drop-shadow(0 0 15px #ff3659) drop-shadow(0 0 38px #ff3659) saturate(1.8)';o.b.style.transition='left 6.5s linear,top .8s ease,filter .2s,transform .2s';o.b.style.transform='scale(1.18) rotate(-8deg)';toast('🚨 本番環境へ逃亡開始！','var(--red)');chord([130,104,82],.16,'sawtooth',.72);const exit=document.getElementById('bugExit');const exitRect=exit.getBoundingClientRect(),stageRect=stage.getBoundingClientRect();const targetLeft=Math.max(0,exitRect.left-stageRect.left+22);o.b.style.top=Math.max(82,Math.min(stage.clientHeight-90,parseFloat(o.b.style.top)||120))+'px';requestAnimationFrame(()=>{if(!o.hit)o.b.style.left=targetLeft+'px'})}function registerEscape(o){if(o.hit)return;o.hit=true;o.b.remove();escaped++;boom();toast(`本番流出！ 逃亡 ${escaped}/5`,'var(--red)');chord([92,73,55],.28,'sawtooth',.8);update();if(escaped>=5){active=false;fail(i,'5匹のバグが本番環境へ到達しました。')}}function loop(ts){if(!active)return;if(mobileGameLite&&lastLoop&&ts-lastLoop<32){requestAnimationFrame(loop);return}lastLoop=ts;if(ts-lastSpawn>1800){spawn();lastSpawn=ts}const exit=document.getElementById('bugExit');const exitRect=exit?exit.getBoundingClientRect():null;for(const o of bugs){if(o.hit)continue;if(!o.escaping&&ts>=o.escapeAt){startEscape(o);continue}if(!o.escaping&&ts>o.nextMove){o.nextMove=ts+3800+Math.random()*2200;o.b.style.left=(18+Math.random()*Math.max(70,stage.clientWidth-230))+'px';o.b.style.top=(86+Math.random()*Math.max(100,stage.clientHeight-210))+'px'}if(o.escaping&&exitRect){const r=o.b.getBoundingClientRect();const overlap=r.right>=exitRect.left&&r.left<=exitRect.right&&r.bottom>=exitRect.top&&r.top<=exitRect.bottom;if(overlap){registerEscape(o);if(!active)return}}}bugs=bugs.filter(o=>!o.hit||document.body.contains(o.b));requestAnimationFrame(loop)}requestAnimationFrame(loop);cleanups.push(()=>{active=false;for(const o of bugs)o.b.remove()})}
function meeting(i){stage.innerHTML=`<div class="stackCenter center"><div class="status" id="meetHud">脱出成功 0 / 3</div><h3 id="mq">会議中……</h3><div class="meeting"><div class="face">👨‍💼<span>部長</span></div><div class="face">👩‍💻<span>PM</span></div><div class="face">👨‍💻<span>開発</span></div><div class="face">😐<span>あなた</span></div></div><div class="timing"><div class="zone"></div><div class="needle" id="needle"></div></div><button class="hugeBtn" id="leave">退室</button><p class="muted">白い針が緑ゾーンに入った瞬間だけ押す。3回成功で脱出。</p></div>`;let successes=0,active=true,pos=0,dir=1,last=0;const needle=document.getElementById('needle'),mq=document.getElementById('mq'),hud=document.getElementById('meetHud'),leave=document.getElementById('leave');function loop(ts){if(!active)return;if(mobileGameLite&&last&&ts-last<32){requestAnimationFrame(loop);return}const dt=Math.min(35,last?ts-last:16);last=ts;pos+=dir*.065*dt;if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}needle.style.left=`calc(${pos}% - 4px)`;mq.textContent=pos>=42&&pos<=58?'他にありますか？':['では次の議題です','ちなみに1点だけ','それ関連で','共有ですが'][Math.floor((ts/900)%4)];requestAnimationFrame(loop)}leave.onclick=()=>{if(pos>=42&&pos<=58){successes++;chord([523,659,784],.1,'square',1);toast(`ESCAPE CHANCE ${successes}/3`,'var(--green)');hud.textContent=`脱出成功 ${successes} / 3`;pos=0;dir=1;if(successes>=3){active=false;finish(i,'会議脱出成功！「では解散で」が実在しました。')}}else{boom();toast('まだ終わっていません','var(--red)');pos=Math.random()*30;dir=1}};requestAnimationFrame(loop);cleanups.push(()=>active=false)}

function shrine(i){stage.innerHTML=`<div class="stackCenter center"><div class="status" id="shrHud">祈祷コンボ 0 / 7</div><div class="status right" id="shrJudge">判定：会議脱出と同一</div><div class="shrine pulse">⛩️</div><div class="sigil" style="width:260px;height:260px;box-shadow:0 0 45px #49d8ff22,inset 0 0 45px #7f5cff22"></div><div class="sigil" style="width:340px;height:340px;animation-direction:reverse;border-style:dashed"></div><div class="sigil" style="width:430px;height:430px;animation-duration:13s;border-color:#ffe45e22"></div><h3 id="shrMsg">光った瞬間に鈴を鳴らせ</h3><button class="hugeBtn gold" id="pray">🔔 鈴を鳴らす</button><div class="timing" id="shrTiming" style="margin-top:18px;height:54px;box-shadow:0 0 24px #49d8ff33"><div class="zone" id="shrZone" style="left:42%;width:16%;box-shadow:0 0 22px #40e78c88,inset 0 0 18px #fff3"></div><div class="needle" id="shrNeedle" style="width:8px;box-shadow:0 0 20px #fff,0 0 34px #49d8ff"></div></div><div class="muted">会議脱出シミュレーターと同じ判定：42〜58で成功</div></div>`;let combo=0,active=true,pos=0,dir=1,last=0;const nd=document.getElementById('shrNeedle'),btn=document.getElementById('pray'),hud=document.getElementById('shrHud'),msg=document.getElementById('shrMsg'),zone=document.getElementById('shrZone'),judge=document.getElementById('shrJudge');function loop(ts){if(!active)return;if(mobileGameLite&&last&&ts-last<32){requestAnimationFrame(loop);return}const dt=Math.min(35,last?ts-last:16);last=ts;pos+=dir*.065*dt;if(pos>=100){pos=100;dir=-1}if(pos<=0){pos=0;dir=1}nd.style.left=`calc(${pos}% - 4px)`;const hit=pos>=42&&pos<=58;msg.textContent=hit?'今だ！！！':'光った瞬間に鈴を鳴らせ';msg.style.color=hit?'var(--yellow)':'';zone.style.filter=hit?'brightness(2.2) saturate(1.8)':'';judge.textContent=hit?'判定：SUCCESS ZONE':'判定：会議脱出と同一';requestAnimationFrame(loop)}btn.onclick=e=>{if(pos>=42&&pos<=58){combo++;burst(e.clientX,e.clientY,42);chord([392,523,659],.22,'sine',1);chord([784,988,1175],.12,'triangle',.55);flash();confetti(22);toast(`祈祷 COMBO ×${combo}`,'var(--yellow)');hud.textContent=`祈祷コンボ ${combo} / 7`;pos=0;dir=1;if(combo>=7){active=false;finish(i,'大吉：成功率は変わりません。気持ちは整いました。')}}else{combo=0;boom();chord([196,185,174],.16,'sawtooth',.7);toast('フライング祈祷','var(--red)');hud.textContent='祈祷コンボ 0 / 7';pos=Math.random()*30;dir=1}};requestAnimationFrame(loop);cleanups.push(()=>active=false)}
})();
</script></body></html>
